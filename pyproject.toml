[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "servicepilot"
version = "0.3.0"
description = "Deterministic backend for the ServicePilot customer-service agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "google-cloud-firestore>=2.20,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn>=0.32,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]
voice = [
  "google-cloud-dialogflow-cx>=1.39,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
cache_dir = "/tmp/servicepilot-pytest-cache"
